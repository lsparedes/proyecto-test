<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modulo 3</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #fff;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    .screen-view {
      display: none;
      position: relative;
      width: 100vw;
      height: 100vh;
      padding: 32px 32px 128px;
      box-sizing: border-box;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: #fff;
    }

    .screen-view.is-active {
      display: flex;
    }

    .screen-panel {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    .instruction-text {
      font-size: 1.2rem;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .center-audio {
      width: 120px;
      height: 120px;
      cursor: pointer;
      user-select: none;
      -webkit-user-drag: none;
    }

    .word-label {
      font-size: 4rem;
      font-weight: 700;
      letter-spacing: .03em;
    }

    .camera-wrap {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .camera-title {
      font-size: 1.25rem;
      font-weight: 600;
    }

    .camera-preview {
      width: min(56vw, 720px);
      height: min(56vw, 720px);
      max-width: 72vh;
      max-height: 72vh;
      background: #000;
      border-radius: 16px;
      object-fit: contain;
      transform: scaleX(-1);
    }

    .record-controls {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .record-controls img {
      width: 72px;
      height: 72px;
      cursor: pointer;
      user-select: none;
      -webkit-user-drag: none;
    }

    .record-controls img.is-disabled {
      opacity: .5;
      pointer-events: none;
    }

    .hidden {
      display: none !important;
    }

    .corner-icon {
      position: absolute;
      width: 64px;
      height: 64px;
      z-index: 20;
      cursor: pointer;
      user-select: none;
      -webkit-user-drag: none;
    }

    .corner-bottom-left {
      left: 16px;
      bottom: 16px;
      position: absolute;
    }

    .corner-bottom-right {
      right: 16px;
      bottom: 16px;
    }

    .corner-bottom-right-prev {
      right: 96px;
      bottom: 16px;
      transform: rotate(180deg);
    }

    .corner-icon.is-disabled {
      opacity: .35;
      pointer-events: none;
    }

    .title-label {
      font-size: 3.25rem;
      font-weight: 700;
      letter-spacing: .02em;
    }

    .audio-pair {
      display: flex;
      gap: 28px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }

    .audio-pair img {
      width: 96px;
      height: 96px;
      cursor: pointer;
      user-select: none;
      -webkit-user-drag: none;
    }

    .audio-pair img.is-disabled {
      opacity: .45;
      pointer-events: none;
    }

    .audio-status {
      font-size: 1.05rem;
      line-height: 1.5;
      max-width: 760px;
      margin: 0 auto;
    }

    .center-image {
      max-width: 92vw;
      max-height: 78vh;
      object-fit: contain;
      display: block;
      margin: 0 auto;
    }

    #p3-screen-image-audio .screen-panel,
    #p3-screen-story-intro .screen-panel,
    #p3-screen-story-image .screen-panel {
      max-width: none;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    #p3-main-image,
    #p3-story-intro-image,
    #p3-story-image {
      margin-left: auto;
      margin-right: auto;
    }

    .audio-stack-left {
      position: absolute;
      left: 16px;
      bottom: 96px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 20;
    }

    .audio-stack-right {
      position: absolute;
      right: 16px;
      bottom: 96px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 20;
    }

    .single-audio-right {
      right: 16px;
      bottom: 96px;
      position: absolute;
    }

    .record-controls-right {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin: 20px auto 0;
    }

    .audio-stack-left img,
    .audio-stack-right img,
    .record-controls-right img,
    .single-audio-left,
    .single-audio-right {
      width: 72px;
      height: 72px;
      cursor: pointer;
      user-select: none;
      -webkit-user-drag: none;
    }

    img[id$="fullscreen-btn"] {
      width: 56px;
      height: 56px;
      object-fit: contain;
    }

    .motor-text {
      font-size: 1.35rem;
      line-height: 1.55;
      max-width: 920px;
      margin: 0 auto 24px;
      text-align: left;
    }

    .motor-text.is-centered {
      text-align: center;
      margin: 0 auto 20px;
      max-width: min(92vw, 980px);
    }

    .motor-audio-list {
      position: absolute;
      left: 16px;
      bottom: 96px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      margin: 0;
      z-index: 20;
    }

    .motor-audio-list.is-centered {
      position: static;
      flex-direction: row;
      justify-content: center;
      align-items: center;
      margin: 18px auto;
    }

    .motor-audio-list img {
      width: 72px;
      height: 72px;
      cursor: pointer;
      user-select: none;
      -webkit-user-drag: none;
    }

    #topBar {
      position: absolute;
      left: 12px;
      top: 12px;
      font-size: 14px;
      background: rgba(255, 255, 255, 0.95);
      padding: 4px 6px;
      z-index: 50;
    }
  </style>
</head>
<body>
  <div id="topBar"></div>

  <!-- Procesos Motores Basicos -->

  <!-- Parte 1 - Test 1 -->
  <section id="part-1-test-1" style="display:none;">
    <div id="p1t1-screen-instruction" class="screen-view is-active">
      <div class="screen-panel">
        <p id="p1t1-instruction-text" class="instruction-text">
          Presiona el audio para escuchar la instruccion inicial y luego usa la flecha para continuar.
        </p>
        <img id="p1t1-center-audio" class="center-audio" src="audio.png" alt="Audio">
      </div>
    </div>

    <div id="p1t1-screen-word" class="screen-view">
      <div class="screen-panel">
        <div id="p1t1-word-label" class="word-label">Cara</div>
      </div>
    </div>

    <div id="p1t1-screen-record" class="screen-view">
      <div class="screen-panel">
        <div class="camera-wrap">
          <div id="p1t1-record-title" class="camera-title"></div>
          <video id="p1t1-camera" class="camera-preview" autoplay playsinline muted></video>
          <div class="record-controls">
            <img id="p1t1-rec-btn" src="rec.png" alt="Rec">
            <img id="p1t1-recording-indicator" class="hidden" src="grabando.png" alt="Grabando">
            <img id="p1t1-stop-btn" class="is-disabled" src="detener.png" alt="Detener">
          </div>
        </div>
      </div>
    </div>

    <img id="p1t1-fullscreen-btn" class="corner-icon corner-bottom-left" src="full-screen.png" alt="Pantalla completa">
    <img id="p1t1-audio-btn" class="corner-icon corner-bottom-left" src="audio.png" alt="Audio" style="display:none;">
    <img id="p1t1-next-btn" class="corner-icon corner-bottom-right" src="flecha.png" alt="Siguiente">
    <audio id="p1t1-audio-player"></audio>
  </section>

  <!-- Parte 1 - Test 2 -->
  <section id="part-1-test-2" style="display:none;">
    <div id="p1t2-screen-title" class="screen-view">
      <div class="screen-panel">
        <div id="p1t2-title-label" class="title-label">Tiempo maximo espiracion</div>
      </div>
    </div>

    <div id="p1t2-screen-audios" class="screen-view">
      <div class="screen-panel">
        <div class="audio-pair">
          <img id="p1t2-audio-1-btn" src="audio.png" alt="Audio 1">
          <img id="p1t2-audio-2-btn" src="audio2.png" alt="Audio 2">
        </div>
        <div id="p1t2-status" class="audio-status">
          Reproduce el primer audio. La grabacion comenzara automaticamente 2-3 segundos antes de terminar.
        </div>
        <div class="record-controls">
          <img id="p1t2-recording-indicator" class="hidden" src="grabando.png" alt="Grabando">
          <img id="p1t2-stop-btn" class="hidden" src="detener.png" alt="Detener">
        </div>
      </div>
    </div>

    <img id="p1t2-next-btn" class="corner-icon corner-bottom-right" src="flecha.png" alt="Siguiente">
    <audio id="p1t2-audio-player"></audio>
  </section>

  <!-- Evaluacion Motora del Habla -->

  <section id="part-2-motor" style="display:none;">
    <div id="p2motor-screen" class="screen-view">
      <div class="screen-panel">
        <div id="p2motor-title" class="title-label"></div>
        <p id="p2motor-label" class="instruction-text"></p>
        <p id="p2motor-text" class="motor-text"></p>
        <div id="p2motor-audios" class="motor-audio-list"></div>
        <div id="p2motor-record-controls" class="record-controls">
          <img id="p2motor-rec-btn" src="rec.png" alt="Rec">
          <img id="p2motor-recording-indicator" class="hidden" src="grabando.png" alt="Grabando">
          <img id="p2motor-stop-btn" class="is-disabled" src="detener.png" alt="Detener">
        </div>
      </div>
    </div>

    <img id="p2motor-fullscreen-btn" class="corner-icon corner-bottom-left" src="full-screen.png" alt="Pantalla completa">
    <img id="p2motor-next-btn" class="corner-icon corner-bottom-right" src="flecha.png" alt="Siguiente">
    <audio id="p2motor-audio-player"></audio>
  </section>

  <!-- Habla Conectada -->

  <!-- Parte 3 - Test 1 -->
  <section id="part-3-test-1" style="display:none;">
    <div id="p3-screen-image-audio" class="screen-view">
      <div class="screen-panel">
        <img id="p3-main-image" class="center-image" src="" alt="Stimulus">
      </div>
      <img id="p3-single-audio-btn" class="single-audio-right" src="audio.png" alt="Audio">
    </div>

    <div id="p3-screen-story-intro" class="screen-view">
      <div class="screen-panel">
        <img id="p3-story-intro-image" class="center-image" src="" alt="Historia">
      </div>
      <div class="audio-stack-right">
        <img id="p3-audio-top-btn" src="audio.png" alt="Audio superior">
        <img id="p3-audio-bottom-btn" src="audio2.png" alt="Audio inferior">
      </div>
    </div>

    <div id="p3-screen-story-image" class="screen-view">
      <div class="screen-panel">
        <img id="p3-story-image" class="center-image" src="" alt="Historia secuencia">
      </div>
    </div>

    <div id="p3-screen-final" class="screen-view">
      <div class="screen-panel">
        <div class="word-label">FIN</div>
      </div>
      <img id="p3-final-audio-btn" class="single-audio-right" src="audio.png" alt="Audio final">
    </div>

    <div id="p3-screen-personal" class="screen-view">
      <div class="screen-panel">
        <div class="title-label">Narración personal</div>
      </div>
      <img id="p3-personal-audio-btn" class="single-audio-right" src="audio.png" alt="Audio narracion personal">
    </div>

    <div id="p3-record-controls" class="record-controls-right hidden">
      <img id="p3-recording-indicator" src="grabando.png" alt="Grabando">
      <img id="p3-stop-btn" src="detener.png" alt="Detener">
    </div>
    <img id="p3-fullscreen-btn" class="corner-icon corner-bottom-left" src="full-screen.png" alt="Pantalla completa">
    <img id="p3-prev-btn" class="corner-icon corner-bottom-right-prev" src="flecha.png" alt="Anterior" style="display:none;">
    <img id="p3-next-btn" class="corner-icon corner-bottom-right" src="flecha.png" alt="Siguiente">
    <audio id="p3-audio-player"></audio>
  </section>

  <!-- Parte 3 - Test 2 -->

  <!-- Parte 3 - Test 3 -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.7.1/jszip.min.js"></script>
  <script type="module" src="js/runner.js"></script>
</body>
</html>
