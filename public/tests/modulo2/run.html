<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CAT</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      background: #fff;
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      color: #000;
    }

    #screen {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #fff;
    }

    /* ===== Barra superior (Parte / Ensayo) ===== */
    #topBar {
      position: absolute;
      left: 12px;
      top: 12px;
      font-size: 14px;
      background: rgba(255, 255, 255, 0.95);
      padding: 4px 6px;
      z-index: 50;
      display: none !important;
    }

    .item-indicator {
      position: absolute;
      top: 10px;
      left: 10px;
      font-size: 23px;
      font-weight: bold;
      padding: 5px 10px;
      border-radius: 5px;
      background-color: rgba(var(--bs-light-rgb), var(--bs-bg-opacity, 1)) !important;
      color: rgba(var(--bs-dark-rgb), var(--bs-text-opacity, 1)) !important;
      box-shadow: var(--bs-box-shadow, 0 .5rem 1rem rgba(0, 0, 0, .15)) !important;
      z-index: 95;
      display: none;
    }

    /* ===== Botones inferiores (flecha / fullscreen) ===== */
    .cornerBtn {
      position: absolute;
      bottom: 14px;
      width: 56px;
      height: 56px;
      cursor: pointer;
      z-index: 60;
      user-select: none;
      -webkit-user-drag: none;
    }

    #btnFullscreen {
      left: 14px;
      display: none;
    }

    body.fullscreen-after-first #btnFullscreen {
      display: none !important;
    }

    /* solo ensayo 1 */
    #btnNext {
      right: 14px;
      display: none;
    }

    /* aparece cuando corresponde */

    /* ===== Centro semántica ===== */
    #centerBox {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      border: 2px solid #000;
      padding: 10px;
      background: #fff;
    }

    img {
      display: block;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    #centerBox img {
      max-width: 320px;
      max-height: 260px;
    }

    /* Opciones esquinas */
    .opt {
      position: absolute;
      cursor: pointer;
      padding: 12px;
      background: #fff;
      border: 2px solid #000;
      width: 300px;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
    }

    /* Imágenes opciones */
    .opt img {
      max-width: 270px;
      max-height: 190px;
      width: 100%;
      height: 100%;
    }

    #opt0 {
      left: 22%;
      top: 22%;
      transform: translate(-50%, -50%);
    }

    #opt1 {
      left: 78%;
      top: 22%;
      transform: translate(-50%, -50%);
    }

    #opt2 {
      left: 22%;
      top: 78%;
      transform: translate(-50%, -50%);
    }

    #opt3 {
      left: 78%;
      top: 78%;
      transform: translate(-50%, -50%);
    }


    /* Selección/feedback minimalista */
    .selected {
      border-color: #2563eb;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.2);
    }

    /* lo que tocó */
    .correct {
      border-color: #000;
    }

    /* la correcta (igual negro, como pediste básico) */
    .wrong {
      border-style: dashed;
    }

    /* si quieres distinguir la incorrecta sin color */

    /* ===== Layout cálculo (se mantiene) ===== */
    #calcPromptBox {
      position: absolute;
      left: 50%;
      top: 34%;
      transform: translate(-50%, -50%);
      padding: 14px 18px;
      background: #fff;
    }

    #calcPromptBox img {
      max-width: 760px;
      max-height: 320px;
    }

    #calcOptions {
      position: absolute;
      left: 50%;
      top: 68%;
      transform: translate(-50%, -50%);
      display: flex;
      gap: 18px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      width: 92vw;
    }

    .opt5 {
      cursor: pointer;
      padding: 10px;
      border: 2px solid #000;
      background: #fff;
    }

    .opt5 img {
      max-width: 180px;
      max-height: 150px;
      object-fit: contain;
    }

    .opt5.selected {
      border-color: #2563eb;
      background: #dbeafe;
    }

    .opt5.correct {
      border-color: #000;
    }

    .opt5.wrong {
      border-style: dashed;
    }

    /* ===== Layout Texto + Imagen ===== */
    #textInstruction {
      position: absolute;
      left: 12px;
      right: 12px;
      top: 48px;
      /* debajo del topBar */
      font-size: 18px;
      padding: 6px 4px;
    }

    #textImageWrap {
      position: absolute;
      left: 50%;
      top: 38%;
      transform: translate(-50%, -50%);
      width: 92vw;
      max-width: 1100px;
      display: flex;
      justify-content: center;
    }

    #textImage {
      max-width: 100%;
      max-height: 46vh;
      object-fit: contain;
    }

    #textBoxWrap {
      position: absolute;
      left: 50%;
      top: 78%;
      transform: translate(-50%, -50%);
      width: 92vw;
      max-width: 1100px;
    }

    #textAnswer {
      width: 100%;
      height: 26vh;
      border: 2px solid #000;
      padding: 12px;
      font-size: 18px;
      resize: none;
      outline: none;
    }

    #textCanvasLabel {
      position: absolute;
      left: 0;
      right: 0;
      top: -52px;
      text-align: center;
      font-size: 34px;
      font-weight: 700;
      color: #111;
      display: none;
    }

    #textWriteCanvas {
      width: 100%;
      height: 100%;
      background: #fff;
      border: 1px solid black;
      touch-action: none;
      cursor: crosshair;
      display: none;
    }

    /* ===== Layout Instrucción ===== */
    #instructionTitle {
      position: absolute;
      left: 12px;
      right: 12px;
      top: 70px;
      font-size: 22px;
      font-weight: 700;
    }

    #instructionBody {
      position: absolute;
      left: 12px;
      right: 12px;
      top: 115px;
      font-size: 18px;
      line-height: 1.35;
      white-space: pre-line;
    }

    /* ===== Layout Dictation ===== */
    #dictationPrompt {
      position: absolute;
      left: 12px;
      right: 12px;
      top: 70px;
      font-size: 18px;
      white-space: pre-line;
    }

    #dictationBoxWrap {
      position: absolute;
      left: 50%;
      top: 62%;
      transform: translate(-50%, -50%);
      width: 92vw;
      max-width: 1100px;
    }

    #dictationAnswer {
      width: 100%;
      height: 32vh;
      border: 2px solid #000;
      padding: 12px;
      font-size: 18px;
      resize: none;
      outline: none;
    }

    /* ===== Layout Escritura con lapiz ===== */
    #layoutWritingCanvas {
      position: absolute;
      inset: 0;
      background: #fff;
    }

    #writingCanvas {
      position: absolute;
      left: 50%;
      top: 52%;
      transform: translate(-50%, -50%);
      width: 92vw;
      height: 78vh;
      border: 2px solid #000;
      background: #fff;
      touch-action: none;
      cursor: crosshair;
    }

    #downloadWritingBtn {
      position: absolute;
      left: 86px;
      bottom: 18px;
      z-index: 90;
      min-height: 48px;
      border: 1px solid #222;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.96);
      color: #000;
      padding: 0 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.14);
      white-space: nowrap;
    }

    #downloadWritingBtn:hover {
      background: #f4f4f4;
    }

    #downloadWritingBtn:active {
      transform: translateY(1px);
    }

    /* Instrucción centrada (cuando runner lo active) */
    .centeredInstruction #instructionTitle,
    .centeredInstruction #instructionBody {
      text-align: center;
    }

    .centeredInstruction #instructionTitle {
      top: 35vh;
      font-size: 26px;
    }

    .centeredInstruction #instructionBody {
      top: 43vh;
      font-size: 18px;
    }

    /* ===== Layout Audio Record ===== */
    #arImageWrap {
      position: absolute;
      left: 50%;
      top: 45%;
      transform: translate(-50%, -50%);
      width: 92vw;
      max-width: 1100px;
      display: flex;
      justify-content: center;
    }

    #arImage {
      max-width: 100%;
      max-height: 60vh;
      object-fit: contain;
    }

    #arControls {
      position: absolute;
      left: 50%;
      top: 82%;
      transform: translate(-50%, -50%);
      display: flex;
      gap: 22px;
      align-items: center;
      justify-content: center;
    }

    #arControls img {
      width: 72px;
      height: 72px;
      cursor: pointer;
      user-select: none;
      -webkit-user-drag: none;
    }

    #arWordWrap {
      position: absolute;
      left: 50%;
      top: 45%;
      transform: translate(-50%, -50%);
      width: 92vw;
      max-width: 1100px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #arWord {
      font-size: 86px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-align: center;
    }

    /* ===== Video record layout ===== */
    #vrPreviewWrap {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 92vw;
      max-width: 1100px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #vrPreview {
      max-height: 80vh;
      border: 2px solid #000;
      object-fit: cover;
      transform: scaleX(-1) !important;
    }

    #vrStimImageWrap {
      position: absolute;
      left: 25%;
      top: 42%;
      transform: translate(-50%, -50%);
      width: 92vw;
      max-width: 1100px;
      display: flex;
      justify-content: center;
    }

    #vrStimImage {
      max-width: 100%;
      max-height: 55vh;
      object-fit: contain;
    }

    #vrSmallPreviewWrap {
      position: absolute;
      right: 17%;
      top: 100px;
      width: 520px;
      height: 350px;
      border: 2px solid #000;
      background: #fff;
      overflow: hidden;
    }

    #vrSmallPreview {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1) !important;
    }

    #vrControls {
      position: absolute;
      left: 50%;
      top: 83%;
      transform: translate(-50%, -50%);
      display: flex;
      gap: 22px;
      align-items: center;
      justify-content: center;
    }

    #vrControls img {
      width: 72px;
      height: 72px;
      cursor: pointer;
      user-select: none;
      -webkit-user-drag: none;
    }

    #centerWord {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: 80px;
      font-weight: 700;
      background: #fff;
      padding: 6px 12px;
    }

    /* Centrar 2 audios uno al lado del otro (Test 9 pantalla 1) */
    .twoCenterAudios #btnAudioCenter {
      transform: translate(-140px, -50%) !important;
    }

    .twoCenterAudios #btnAudioCenter2 {
      transform: translate(20px, -50%) !important;
    }

    /* ===== Audios centrados apilados ===== */
    #centerAudiosStack {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      gap: 18px;
      align-items: center;
      justify-content: center;
      z-index: 80;
    }

    #centerAudiosStack img {
      width: 110px;
      height: 110px;
      cursor: pointer;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* ===== Sí/No centrado ===== */
    #yesNoWrap {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      gap: 80px;
      align-items: center;
      justify-content: center;
    }

    .ynBtn {
      border: 2px solid #000;
      padding: 18px 44px;
      font-size: 44px;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
    }

    .ynBtn.selected {
      outline: 4px solid #000;
    }

    #repeatCenter {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      gap: 18px;
      align-items: center;
      justify-content: center;
      z-index: 80;
    }

    #btnRepeatPlay {
      width: 120px;
      height: 120px;
      cursor: pointer;
      user-select: none;
      -webkit-user-drag: none;
    }

    #repeatRecRow {
      display: flex;
      gap: 18px;
      align-items: center;
      justify-content: center;
    }

    #repeatRecRow img {
      width: 90px;
      height: 90px;
      cursor: pointer;
      user-select: none;
      -webkit-user-drag: none;
    }

    .stackCenterAudios #btnAudioCenter {
      transform: translate(-50%, -120px) !important;
    }

    .stackCenterAudios #btnAudioCenter2 {
      transform: translate(-50%, 20px) !important;
    }

    /* ===== Test 17 Layout ===== */
    #t17ImageWrap {
      position: absolute;
      left: 50%;
      top: 48%;
      transform: translate(-50%, -50%);
      width: 92vw;
      max-width: 1100px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #t17Image {
      max-width: 100%;
      max-height: 74vh;
      object-fit: contain;
    }

    /* columna audios sup derecha */
    #t17InstrCol {
      position: absolute;
      top: 70px;
      /* debajo del topBar */
      right: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 90;
    }

    .t17InstrItem {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .t17Lbl {
      font-weight: 700;
      font-size: 16px;
      width: 28px;
      text-align: right;
    }

    .t17AudioIcon {
      width: 56px;
      height: 56px;
      cursor: pointer;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* grabación abajo centro */
    #t17RecRow {
      position: absolute;
      left: 50%;
      top: 86%;
      transform: translate(-50%, -50%);
      display: flex;
      gap: 18px;
      align-items: center;
      justify-content: center;
    }

    #t17RecRow img {
      width: 68px;
      height: 68px;
      cursor: pointer;
      user-select: none;
      -webkit-user-drag: none;
    }

    #t18ImageWrap {
      position: absolute;
      left: 50%;
      top: 48%;
      transform: translate(-50%, -50%);
      width: 92vw;
      max-width: 1100px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #t18Image {
      max-width: 100%;
      max-height: 65vh;
      object-fit: contain;
    }

    #t18RecRow {
      position: absolute;
      left: 50%;
      top: 86%;
      transform: translate(-50%, -50%);
      display: flex;
      gap: 18px;
      align-items: center;
      justify-content: center;
    }

    #t18RecRow img {
      width: 68px;
      height: 68px;
      cursor: pointer;
    }

    #t3CenterText {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: 48px;
      font-weight: 700;
    }

    #t3RecRow {
      position: absolute;
      left: 50%;
      top: 86%;
      transform: translate(-50%, -50%);
      display: flex;
      gap: 18px;
    }

    #t3RecRow img {
      width: 78px;
      height: 78px;
      cursor: pointer;
    }

    #lbCanvas {
      position: absolute;
      left: 25%;
      top: 25%;
      width: 50vw;
      height: 50vh;
      touch-action: none;
    }

    #handFinishScreen {
      position: absolute;
      inset: 0;
      display: none;
      background: #fff;
      z-index: 300;
    }

    #handFinishMessage {
      position: absolute;
      left: 50%;
      top: 44%;
      transform: translate(-50%, -50%);
      width: min(90vw, 900px);
      text-align: center;
    }

    #handFinishMessage h1 {
      margin: 0;
      font-size: clamp(36px, 3vw, 44px);
      line-height: 1.35;
    }

    #handFinishCardRow {
      position: absolute;
      left: 50%;
      bottom: 15px;
      transform: translateX(-50%);
      width: min(92vw, 980px);
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }

    #selectHand {
      display: none;
      background-color: #f9f9f9;
      border: 1px solid #ddd;
      padding: 20px;
    }

    #selectHand h4 {
      margin: 0 0 10px;
      font-size: 14px;
      font-weight: bold;
      text-align: center;
    }

    .handOptionRow {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 6px;
      font-size: 18px;
    }

    #handButton {
      background-color: transparent;
      border: none;
      cursor: pointer;
      background-image: url('flecha.png');
      background-size: contain;
      background-repeat: no-repeat;
      padding: 0;
      width: 90px;
      height: 80px;
      position: fixed;
      right: 15px;
      bottom: 15px;
      display: none;
      z-index: 320;
    }
  </style>
</head>

<body>
  <div id="screen">

    <!-- Top bar -->
    <div id="topBar"></div>
    <div class="item-indicator"><span id="current-item">I</span></div>

    <img id="btnAudio" src="audio.png" alt="Audio instrucciones" style="
        position: absolute;
        top:12px;
        right:12px;
        width:56px;
        height:56px;
        cursor:pointer;
        display:none;
        z-index:70;
        user-select:none;
        -webkit-user-drag:none;
     ">

    <audio id="instructionAudio"></audio>

    <!-- Fullscreen (solo ensayo 1) -->
    <img id="btnFullscreen" class="cornerBtn" src="full-screen.png" alt="Pantalla completa" />

    <!-- Flecha siguiente -->
    <img id="btnNext" class="cornerBtn" src="flecha.png" alt="Siguiente" />

    <!-- ====== LAYOUT TEST 1: Bisección de líneas (paciente) ====== -->
    <div id="layoutLineBisection" style="display:none;">
      <canvas id="lbCanvas"></canvas>
    </div>

    <!-- ====== LAYOUT SEMÁNTICA ====== -->
    <div id="layoutSemantic" style="display:none;">
      <div id="centerBox">
        <img id="centerImg" alt="Centro">
      </div>

      <div class="opt" id="opt0" data-opt="0"><img id="img0" alt="Opción 1"></div>
      <div class="opt" id="opt1" data-opt="1"><img id="img1" alt="Opción 2"></div>
      <div class="opt" id="opt2" data-opt="2"><img id="img2" alt="Opción 3"></div>
      <div class="opt" id="opt3" data-opt="3"><img id="img3" alt="Opción 4"></div>
    </div>

    <!-- ====== LAYOUT TEST 3 ====== -->
    <div id="layoutFluency" style="display:none;">

      <!-- Texto central -->
      <div id="t3CenterText"></div>

      <!-- Audio centrado (pantallas de instrucción) -->
      <img id="t3CenterAudio" src="audio.png" style="
         position:absolute;
         left:50%;
         top:50%;
         transform:translate(-50%,-50%);
         width:120px;
         height:120px;
         display:none;
         cursor:pointer;
       ">

      <!-- Audio sup derecha -->
      <img id="t3TopAudio" src="audio.png" style="
         position:absolute;
         top:70px;
         right:14px;
         width:56px;
         height:56px;
         display:none;
         cursor:pointer;
       ">

      <audio id="t3AudioEl"></audio>

      <!-- Grabación -->
      <div id="t3RecRow">
        <img id="t3Recording" src="grabando.png">
        <img id="t3Stop" src="detener.png">
      </div>

    </div>

    <!-- ====== LAYOUT VIDEO RECORD (Test 5) ====== -->
    <div id="layoutVideoRecord" style="display:none;">

      <!-- Preview cámara (pantalla 1) -->
      <div id="vrPreviewWrap" style="display:none;">
        <video id="vrPreview" autoplay playsinline muted></video>
      </div>

      <!-- Estímulo + preview pequeño (pantallas 2..7) -->
      <div id="vrStimWrap" style="display:none;">
        <div id="vrStimImageWrap">
          <img id="vrStimImage" alt="Estimulo">
        </div>

        <div id="vrSmallPreviewWrap">
          <video id="vrSmallPreview" autoplay playsinline muted></video>
        </div>

      </div>

      <div id="vrControls">
        <img id="vBtnRec" src="rec.png" alt="Grabar">
        <img id="vBtnRecording" src="grabando.png" alt="Grabando" style="display:none;">
        <img id="vBtnStop" src="detener.png" alt="Detener" style="display:none;">
      </div>

    </div>

    <!-- ====== LAYOUT CÁLCULO ====== -->
    <div id="layoutCalc" style="display:none;">
      <div id="calcPromptBox">
        <img id="calcPromptImg" alt="Cálculo">
      </div>

      <div id="calcOptions">
        <div class="opt5" data-opt="0"><img id="cimg0" alt="Resp 1"></div>
        <div class="opt5" data-opt="1"><img id="cimg1" alt="Resp 2"></div>
        <div class="opt5" data-opt="2"><img id="cimg2" alt="Resp 3"></div>
        <div class="opt5" data-opt="3"><img id="cimg3" alt="Resp 4"></div>
        <div class="opt5" data-opt="4"><img id="cimg4" alt="Resp 5"></div>
      </div>
    </div>

    <!-- Audio centrado (Pantalla instrucción Test 7) -->
    <img id="btnAudioCenter" src="audio.png" alt="Audio instrucciones" style="
        position:absolute;
        left:50%;
        top:50%;
        transform:translate(-50%,-50%);
        width:120px;
        height:120px;
        cursor:pointer;
        display:none;
        z-index:80;
        user-select:none;
        -webkit-user-drag:none;
     ">

    <!-- Segundo audio centrado (Test 9 instrucciones) -->
    <img id="btnAudioCenter2" src="audio.png" alt="Audio instrucciones 2" style="
        position:absolute;
        left:50%;
        top:50%;
        transform:translate(-50%,-50%);
        width:120px;
        height:120px;
        cursor:pointer;
        display:none;
        z-index:81;
        user-select:none;
        -webkit-user-drag:none;
     ">

    <audio id="instructionAudioCenter2"></audio>

    <!-- Segundo audio arriba derecha (para práctica Test 7) -->
    <img id="btnAudio2" src="audio.png" alt="Audio instrucciones 2" style="
        position:absolute;
        top:64px;        /* debajo del primero */
        right:12px;
        width:56px;
        height:56px;
        cursor:pointer;
        display:none;
        z-index:70;
        user-select:none;
        -webkit-user-drag:none;
     ">

    <audio id="instructionAudio2"></audio>

    <!-- Layout 8vo test-->

    <div id="centerWord" style="display:none;"></div>

    <!-- ====== LAYOUT AUDIO RECORD (Imagen o Palabra) ====== -->
    <div id="layoutAudioRecord" style="display:none;">

      <!-- Palabra al centro -->
      <div id="arWordWrap" style="display:none;">
        <div id="arWord"></div>
      </div>

      <!-- Imagen al centro -->
      <div id="arImageWrap" style="display:none;">
        <img id="arImage" alt="Imagen">
      </div>

      <div id="arControls">
        <img id="btnRec" src="rec.png" alt="Grabar">
        <img id="btnRecording" src="grabando.png" alt="Grabando" style="display:none;">
        <img id="btnStop" src="detener.png" alt="Detener" style="display:none;">
      </div>
    </div>

    <!-- ====== LAYOUT AUDIOS CENTRADOS TEST 11 (1 a 3 íconos apilados) ====== -->
    <div id="layoutCenterAudios" style="display:none;">
      <div id="centerAudiosStack">
        <img id="cAudio1" src="audio.png" alt="Audio 1">
        <img id="cAudio2" src="audio.png" alt="Audio 2" style="display:none;">
        <img id="cAudio3" src="audio.png" alt="Audio 3" style="display:none;">
      </div>

      <audio id="cAudioEl1"></audio>
      <audio id="cAudioEl2"></audio>
      <audio id="cAudioEl3"></audio>
    </div>

    <!-- ====== LAYOUT AUDIO CENTRADO + GRABACIÓN (Test 12) ====== -->
    <div id="layoutRepeatAudio" style="display:none;">
      <div id="repeatCenter">
        <img id="btnRepeatPlay" src="audio.png" alt="Reproducir audio" />
        <div id="repeatRecRow" style="display:none;">
          <img id="repeatRecording" src="rec.png" alt="Rec" />
          <img id="repeatStop" src="detener.png" alt="Detener" />
        </div>
      </div>

      <audio id="repeatPromptAudio"></audio>
    </div>

    <!-- ====== LAYOUT SI/NO ====== -->
    <div id="layoutYesNo" style="display:none;">
      <div id="yesNoWrap">
        <div class="ynBtn" id="btnYes" data-val="SI">Sí</div>
        <div class="ynBtn" id="btnNo" data-val="NO">No</div>
      </div>
    </div>

    <!-- ====== LAYOUT TEST 17: Imagen + Audios columna + Grabación ====== -->
    <div id="layoutImageInstrRecord" style="display:none;">

      <div id="t17ImageWrap">
        <img id="t17Image" alt="Imagen">
      </div>

      <!-- Audios instrucciones (columna sup derecha) -->
      <div id="t17InstrCol">
        <div class="t17InstrItem" id="t17InstrI" style="display:none;">
          <span class="t17Lbl">I</span>
          <img class="t17AudioIcon" src="audio.png" alt="Audio I">
        </div>

        <div class="t17InstrItem" id="t17InstrP" style="display:none;">
          <span class="t17Lbl">P</span>
          <img class="t17AudioIcon" src="audio.png" alt="Audio P">
        </div>

        <div class="t17InstrItem" id="t17InstrPS" style="display:none;">
          <span class="t17Lbl">PS</span>
          <img class="t17AudioIcon" src="audio.png" alt="Audio PS">
        </div>

        <div class="t17InstrItem" id="t17InstrPF" style="display:none;">
          <span class="t17Lbl">PF</span>
          <img class="t17AudioIcon" src="audio.png" alt="Audio PF">
        </div>
      </div>

      <!-- Grabación (auto) -->
      <div id="t17RecRow">
        <img id="t17Recording" src="grabando.png" alt="Grabando">
        <img id="t17Stop" src="detener.png" alt="Detener">
      </div>
    </div>

    <audio id="t17AudioI"></audio>
    <audio id="t17AudioP"></audio>
    <audio id="t17AudioPS"></audio>
    <audio id="t17AudioPF"></audio>

    <!-- ====== LAYOUT TEST 18 ====== -->
    <div id="layoutImageRecordSimple" style="display:none;">

      <div id="t18ImageWrap">
        <img id="t18Image" alt="Imagen">
      </div>

      <!-- Audio instrucción (solo pantalla 1) -->
      <img id="t18InstrAudio" src="audio.png" alt="Audio instrucción" style="
         position:absolute;
         top:70px;
         right:14px;
         width:56px;
         height:56px;
         cursor:pointer;
         display:none;
         z-index:90;
       ">

      <audio id="t18AudioEl"></audio>

      <!-- Grabación -->
      <div id="t18RecRow">
        <img id="t18Recording" src="grabando.png" alt="Grabando" style="display:none;">
        <img id="t18Stop" src="detener.png" alt="Detener" style="display:none;">
      </div>

    </div>

    <!-- ====== LAYOUT INSTRUCCIÓN SIMPLE (Parte 26 - Pantalla 1) ====== -->
    <div id="layoutInstruction" style="display:none;">
      <div id="instructionTitle"></div>
      <div id="instructionBody"></div>
    </div>

    <!-- ====== LAYOUT DICTADO (Parte 26 - Práctica + Ensayos) ====== -->
    <div id="layoutDictation" style="display:none;">
      <div id="dictationPrompt"></div>
      <div id="dictationBoxWrap">
        <textarea id="dictationAnswer" spellcheck="false"></textarea>
      </div>
    </div>

    <!-- ====== LAYOUT ESCRITURA CON LAPIZ ====== -->
    <div id="layoutWritingCanvas" style="display:none;">
      <canvas id="writingCanvas"></canvas>
      <button id="downloadWritingBtn" type="button">Descargar imagen</button>
    </div>

    <!-- ====== LAYOUT TEXTO + IMAGEN (Parte 27) ====== -->
    <div id="layoutTextImage" style="display:none;">

      <div id="textInstruction"></div>

      <div id="textImageWrap">
        <img id="textImage" alt="Imagen a describir">
      </div>

      <div id="textBoxWrap">
        <div id="textCanvasLabel">¿Qué ocurre en esta imagen?</div>
        <textarea id="textAnswer" spellcheck="false"></textarea>
        <canvas id="textWriteCanvas"></canvas>
      </div>
    </div>


  </div>

  <div id="handFinishScreen">
    <div id="handFinishMessage">
      <h1>¡Ha completado esta tarea con éxito!</h1>
      <h1>¡Muchas gracias!</h1>
    </div>
    <div id="handFinishCardRow">
      <div id="selectHand" class="card opacity-75 col-3 col-md-4 col-xl-6 ms-3 p-3">
        <div class="card-body" style="padding: 0;">
          <h4>Mano usada</h4>
          <div class="d-flex align-items-start">
            <input type="radio" id="right_hand" name="hand" value="derecha">
            <label for="right_hand">Derecha</label>
          </div>
          <div class="d-flex align-items-start">
            <input type="radio" id="left_hand" name="hand" value="izquierda">
            <label for="left_hand">Izquierda</label>
          </div>
          <div class="d-flex align-items-start">
            <input type="radio" id="both_hands" name="hand" value="ambas">
            <label for="both_hands">Ambas</label>
          </div>
        </div>
      </div>
    </div>
    <button id="handButton" type="button" aria-label="Finalizar"></button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.16.9/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.7.1/jszip.min.js"></script>
  <script type="module" src="js/runner.js"></script>
</body>

</html>
