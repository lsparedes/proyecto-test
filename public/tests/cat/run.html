<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CAT - Memoria semántica</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #fff;
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      color: #000;
    }

    /* Contenedor a pantalla completa */
    #screen {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #fff;
    }

    /* Centro (con marco fino como en tu ejemplo) */
    #centerBox {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      border: 2px solid #000;
      padding: 10px;
      background: #fff;
    }

    /* Imágenes */
    img {
      display: block;
      max-width: 280px;
      max-height: 220px;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    #centerBox img { max-width: 320px; max-height: 260px; }

    /* Opción clickeable */
    .opt {
      position: absolute;
      cursor: pointer;
      padding: 6px;
      background: transparent;
      border: 2px solid transparent;
    }

    /* Bordes en esquinas (como el PPT/ejemplo) */
    #opt0 { left: 40px;  top: 40px; }   /* sup-izq */
    #opt1 { right: 40px; top: 40px; }   /* sup-der */
    #opt2 { left: 40px;  bottom: 40px;} /* inf-izq */
    #opt3 { right: 40px; bottom: 40px;} /* inf-der */

    /* Selección (simple, sin color de relleno) */
    .selected { border-color: #000; }

    /* Barra mínima (opcional) */
    #miniBar {
      position: absolute;
      left: 12px;
      bottom: 12px;
      font-size: 14px;
      background: rgba(255,255,255,0.9);
      padding: 4px 6px;
    }

    /* Botón volver mínimo */
    #btnBack {
      position: absolute;
      right: 12px;
      bottom: 12px;
      font-size: 14px;
      padding: 6px 10px;
      border: 1px solid #000;
      background: #fff;
      cursor: pointer;
    }

/* ---- cálculo ---- */
#calcPromptBox{
  position:absolute;
  left:50%;
  top:20%;
  transform:translate(-50%,-50%);
  border:2px solid #000;
  padding:10px;
  background:#fff;
}

#calcPromptBox img{
  max-width: 520px;
  max-height: 220px;
}

#calcOptions{
  position:absolute;
  left:50%;
  top:65%;
  transform:translate(-50%,-50%);
  display:flex;
  gap:18px;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
  width: 92vw;
}

.opt5{
  cursor:pointer;
  padding:6px;
  border:2px solid transparent;
}

.opt5.selected{
  border-color:#000;
}

.opt5 img{
  max-width: 160px;
  max-height: 140px;
  object-fit: contain;
}

  </style>
</head>

<body>
  <div id="screen">

  <!-- ====== LAYOUT SEMÁNTICA (Parte 2) ====== -->
  <div id="layoutSemantic" style="display:none;">
    <div id="centerBox">
      <img id="centerImg" alt="Centro">
    </div>

    <div class="opt" id="opt0" data-opt="0"><img id="img0" alt="Opción 1"></div>
    <div class="opt" id="opt1" data-opt="1"><img id="img1" alt="Opción 2"></div>
    <div class="opt" id="opt2" data-opt="2"><img id="img2" alt="Opción 3"></div>
    <div class="opt" id="opt3" data-opt="3"><img id="img3" alt="Opción 4"></div>
  </div>

  <!-- ====== LAYOUT CÁLCULO (Parte 6) ====== -->
  <div id="layoutCalc" style="display:none;">
    <div id="calcPromptBox">
      <img id="calcPromptImg" alt="Cálculo">
    </div>

    <div id="calcOptions">
      <div class="opt5" data-opt="0"><img id="cimg0" alt="Resp 1"></div>
      <div class="opt5" data-opt="1"><img id="cimg1" alt="Resp 2"></div>
      <div class="opt5" data-opt="2"><img id="cimg2" alt="Resp 3"></div>
      <div class="opt5" data-opt="3"><img id="cimg3" alt="Resp 4"></div>
      <div class="opt5" data-opt="4"><img id="cimg4" alt="Resp 5"></div>
    </div>
  </div>

  <div id="miniBar"></div>
  <button id="btnBack">Volver</button>
</div>


  <script type="module" src="js/runner.js"></script>
</body>
</html>
