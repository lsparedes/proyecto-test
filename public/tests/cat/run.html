<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CAT</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      background: #fff;
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      color: #000;
    }

    #screen {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #fff;
    }

    /* ===== Barra superior (Parte / Ensayo) ===== */
    #topBar {
      position: absolute;
      left: 12px;
      top: 12px;
      font-size: 14px;
      background: rgba(255, 255, 255, 0.95);
      padding: 4px 6px;
      z-index: 50;
    }

    /* ===== Botones inferiores (flecha / fullscreen) ===== */
    .cornerBtn {
      position: absolute;
      bottom: 14px;
      width: 56px;
      height: 56px;
      cursor: pointer;
      z-index: 60;
      user-select: none;
      -webkit-user-drag: none;
    }

    #btnFullscreen {
      left: 14px;
      display: none;
    }

    /* solo ensayo 1 */
    #btnNext {
      right: 14px;
      display: none;
    }

    /* aparece cuando corresponde */

    /* ===== Centro semántica ===== */
    #centerBox {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      border: 2px solid #000;
      padding: 10px;
      background: #fff;
    }

    img {
      display: block;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    #centerBox img {
      max-width: 320px;
      max-height: 260px;
    }

    /* Opciones esquinas */
    .opt {
      position: absolute;
      cursor: pointer;
      padding: 6px;
      background: transparent;
      border: 2px solid transparent;
    }

    /* Imágenes opciones */
    .opt img {
      max-width: 280px;
      max-height: 220px;
    }

    #opt0 {
      left: 12vw;
      top: 12vh;
    }

    #opt1 {
      right: 12vw;
      top: 12vh;
    }

    #opt2 {
      left: 12vw;
      bottom: 12vh;
    }

    #opt3 {
      right: 12vw;
      bottom: 12vh;
    }


    /* Selección/feedback minimalista */
    .selected {
      border-color: #000;
    }

    /* lo que tocó */
    .correct {
      border-color: #000;
    }

    /* la correcta (igual negro, como pediste básico) */
    .wrong {
      border-style: dashed;
    }

    /* si quieres distinguir la incorrecta sin color */

    /* ===== Layout cálculo (se mantiene) ===== */
    #calcPromptBox {
      position: absolute;
      left: 50%;
      top: 20%;
      transform: translate(-50%, -50%);
      border: 2px solid #000;
      padding: 10px;
      background: #fff;
    }

    #calcPromptBox img {
      max-width: 520px;
      max-height: 220px;
    }

    #calcOptions {
      position: absolute;
      left: 50%;
      top: 65%;
      transform: translate(-50%, -50%);
      display: flex;
      gap: 18px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      width: 92vw;
    }

    .opt5 {
      cursor: pointer;
      padding: 6px;
      border: 2px solid transparent;
    }

    .opt5 img {
      max-width: 160px;
      max-height: 140px;
      object-fit: contain;
    }

    .opt5.selected {
      border-color: #000;
    }

    .opt5.correct {
      border-color: #000;
    }

    .opt5.wrong {
      border-style: dashed;
    }

    /* ===== Layout Texto + Imagen ===== */
    #textInstruction {
      position: absolute;
      left: 12px;
      right: 12px;
      top: 48px;
      /* debajo del topBar */
      font-size: 18px;
      padding: 6px 4px;
    }

    #textImageWrap {
      position: absolute;
      left: 50%;
      top: 38%;
      transform: translate(-50%, -50%);
      width: 92vw;
      max-width: 1100px;
      display: flex;
      justify-content: center;
    }

    #textImage {
      max-width: 100%;
      max-height: 46vh;
      object-fit: contain;
    }

    #textBoxWrap {
      position: absolute;
      left: 50%;
      top: 78%;
      transform: translate(-50%, -50%);
      width: 92vw;
      max-width: 1100px;
    }

    #textAnswer {
      width: 100%;
      height: 26vh;
      border: 2px solid #000;
      padding: 12px;
      font-size: 18px;
      resize: none;
      outline: none;
    }

    /* ===== Layout Instrucción ===== */
    #instructionTitle {
      position: absolute;
      left: 12px;
      right: 12px;
      top: 70px;
      font-size: 22px;
      font-weight: 700;
    }

    #instructionBody {
      position: absolute;
      left: 12px;
      right: 12px;
      top: 115px;
      font-size: 18px;
      line-height: 1.35;
      white-space: pre-line;
    }

    /* ===== Layout Dictation ===== */
    #dictationPrompt {
      position: absolute;
      left: 12px;
      right: 12px;
      top: 70px;
      font-size: 18px;
      white-space: pre-line;
    }

    #dictationBoxWrap {
      position: absolute;
      left: 50%;
      top: 62%;
      transform: translate(-50%, -50%);
      width: 92vw;
      max-width: 1100px;
    }

    #dictationAnswer {
      width: 100%;
      height: 32vh;
      border: 2px solid #000;
      padding: 12px;
      font-size: 18px;
      resize: none;
      outline: none;
    }

    /* Instrucción centrada (cuando runner lo active) */
    .centeredInstruction #instructionTitle,
    .centeredInstruction #instructionBody {
      text-align: center;
    }

    .centeredInstruction #instructionTitle {
      top: 35vh;
      font-size: 26px;
    }

    .centeredInstruction #instructionBody {
      top: 43vh;
      font-size: 18px;
    }

    /* ===== Layout Audio Record ===== */
    #arImageWrap {
      position: absolute;
      left: 50%;
      top: 45%;
      transform: translate(-50%, -50%);
      width: 92vw;
      max-width: 1100px;
      display: flex;
      justify-content: center;
    }

    #arImage {
      max-width: 100%;
      max-height: 60vh;
      object-fit: contain;
    }

    #arControls {
      position: absolute;
      left: 50%;
      top: 82%;
      transform: translate(-50%, -50%);
      display: flex;
      gap: 22px;
      align-items: center;
      justify-content: center;
    }

    #arControls img {
      width: 72px;
      height: 72px;
      cursor: pointer;
      user-select: none;
      -webkit-user-drag: none;
    }

    #arWordWrap {
      position: absolute;
      left: 50%;
      top: 45%;
      transform: translate(-50%, -50%);
      width: 92vw;
      max-width: 1100px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #arWord {
      font-size: 56px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-align: center;
    }

    /* ===== Video record layout ===== */
    #vrPreviewWrap {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 92vw;
      max-width: 1100px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #vrPreview {
      max-height: 80vh;
      border: 2px solid #000;
      object-fit: cover;
      transform: scaleX(-1) !important;
    }

    #vrStimImageWrap {
      position: absolute;
      left: 25%;
      top: 42%;
      transform: translate(-50%, -50%);
      width: 92vw;
      max-width: 1100px;
      display: flex;
      justify-content: center;
    }

    #vrStimImage {
      max-width: 100%;
      max-height: 55vh;
      object-fit: contain;
    }

    #vrSmallPreviewWrap {
      position: absolute;
      right: 17%;
      top: 100px;
      width: 520px;
      height: 350px;
      border: 2px solid #000;
      background: #fff;
      overflow: hidden;
    }

    #vrSmallPreview {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1) !important;
    }

    #vrControls {
      position: absolute;
      left: 50%;
      top: 83%;
      transform: translate(-50%, -50%);
      display: flex;
      gap: 22px;
      align-items: center;
      justify-content: center;
    }

    #vrControls img {
      width: 72px;
      height: 72px;
      cursor: pointer;
      user-select: none;
      -webkit-user-drag: none;
    }
  </style>
</head>

<body>
  <div id="screen">

    <!-- Top bar -->
    <div id="topBar"></div>

    <img id="btnAudio" src="audio.png" alt="Audio instrucciones" style="
        position:absolute;
        top:12px;
        right:12px;
        width:46px;
        height:46px;
        cursor:pointer;
        display:none;
        z-index:70;
        user-select:none;
        -webkit-user-drag:none;
     ">

    <audio id="instructionAudio"></audio>

    <!-- Fullscreen (solo ensayo 1) -->
    <img id="btnFullscreen" class="cornerBtn" src="full-screen.png" alt="Pantalla completa" />

    <!-- Flecha siguiente -->
    <img id="btnNext" class="cornerBtn" src="flecha.png" alt="Siguiente" />

    <!-- ====== LAYOUT SEMÁNTICA ====== -->
    <div id="layoutSemantic" style="display:none;">
      <div id="centerBox">
        <img id="centerImg" alt="Centro">
      </div>

      <div class="opt" id="opt0" data-opt="0"><img id="img0" alt="Opción 1"></div>
      <div class="opt" id="opt1" data-opt="1"><img id="img1" alt="Opción 2"></div>
      <div class="opt" id="opt2" data-opt="2"><img id="img2" alt="Opción 3"></div>
      <div class="opt" id="opt3" data-opt="3"><img id="img3" alt="Opción 4"></div>
    </div>

    <!-- ====== LAYOUT VIDEO RECORD (Test 5) ====== -->
    <div id="layoutVideoRecord" style="display:none;">

      <!-- Preview cámara (pantalla 1) -->
      <div id="vrPreviewWrap" style="display:none;">
        <video id="vrPreview" autoplay playsinline muted></video>
      </div>

      <!-- Estímulo + preview pequeño (pantallas 2..7) -->
      <div id="vrStimWrap" style="display:none;">
        <div id="vrStimImageWrap">
          <img id="vrStimImage" alt="Estimulo">
        </div>

        <div id="vrSmallPreviewWrap">
          <video id="vrSmallPreview" autoplay playsinline muted></video>
        </div>

        <div id="vrControls">
          <img id="vBtnRec" src="rec.png" alt="Grabar">
          <img id="vBtnRecording" src="grabando.png" alt="Grabando" style="display:none;">
          <img id="vBtnStop" src="detener.png" alt="Detener" style="display:none;">
        </div>
      </div>

    </div>

    <!-- ====== LAYOUT CÁLCULO ====== -->
    <div id="layoutCalc" style="display:none;">
      <div id="calcPromptBox">
        <img id="calcPromptImg" alt="Cálculo">
      </div>

      <div id="calcOptions">
        <div class="opt5" data-opt="0"><img id="cimg0" alt="Resp 1"></div>
        <div class="opt5" data-opt="1"><img id="cimg1" alt="Resp 2"></div>
        <div class="opt5" data-opt="2"><img id="cimg2" alt="Resp 3"></div>
        <div class="opt5" data-opt="3"><img id="cimg3" alt="Resp 4"></div>
        <div class="opt5" data-opt="4"><img id="cimg4" alt="Resp 5"></div>
      </div>
    </div>

    <!-- ====== LAYOUT AUDIO RECORD (Imagen o Palabra) ====== -->
    <div id="layoutAudioRecord" style="display:none;">

      <!-- Palabra al centro -->
      <div id="arWordWrap" style="display:none;">
        <div id="arWord"></div>
      </div>

      <!-- Imagen al centro -->
      <div id="arImageWrap" style="display:none;">
        <img id="arImage" alt="Imagen">
      </div>

      <div id="arControls">
        <img id="btnRec" src="rec.png" alt="Grabar">
        <img id="btnRecording" src="grabando.png" alt="Grabando" style="display:none;">
        <img id="btnStop" src="detener.png" alt="Detener" style="display:none;">
      </div>
    </div>


    <!-- ====== LAYOUT INSTRUCCIÓN SIMPLE (Parte 26 - Pantalla 1) ====== -->
    <div id="layoutInstruction" style="display:none;">
      <div id="instructionTitle"></div>
      <div id="instructionBody"></div>
    </div>

    <!-- ====== LAYOUT DICTADO (Parte 26 - Práctica + Ensayos) ====== -->
    <div id="layoutDictation" style="display:none;">
      <div id="dictationPrompt"></div>
      <div id="dictationBoxWrap">
        <textarea id="dictationAnswer" spellcheck="false"></textarea>
      </div>
    </div>

    <!-- ====== LAYOUT TEXTO + IMAGEN (Parte 27) ====== -->
    <div id="layoutTextImage" style="display:none;">

      <div id="textInstruction"></div>

      <div id="textImageWrap">
        <img id="textImage" alt="Imagen a describir">
      </div>

      <div id="textBoxWrap">
        <textarea id="textAnswer" spellcheck="false"></textarea>
      </div>
    </div>


  </div>

  <script type="module" src="js/runner.js"></script>
</body>

</html>
