<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CAT - Menú</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <header class="app-header">
    <div class="container d-flex align-items-center justify-content-between">
      <div>
        <div class="h4 mb-0">CAT</div>
        <div class="small text-white-50">Menú de Partes</div>
      </div>

      <div class="d-flex gap-2">
        <button id="btnExport" class="btn btn-outline-light btn-sm">Exportar CSV</button>
        <button id="btnResetAll" class="btn btn-danger btn-sm">Reiniciar todo</button>
      </div>
    </div>
  </header>

  <main class="container my-4">
    <div class="card card-soft">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <div>
            <div class="h5 mb-0">Lista de partes</div>
            <div class="text-muted small">Selecciona una parte para iniciar o reanudar.</div>
          </div>
          <div id="summaryText" class="text-muted small mono"></div>
        </div>

        <div class="table-responsive">
          <table class="table align-middle">
            <thead>
              <tr class="text-muted small">
                <th style="width: 80px;">Parte</th>
                <th>Nombre</th>
                <th style="width: 190px;">Estado</th>
                <th style="width: 260px;" class="text-end">Acciones</th>
              </tr>
            </thead>
            <tbody id="partsTbody"></tbody>
          </table>
        </div>

      </div>
    </div>
  </main>

  <script type="module" src="js/index.js"></script>
</body>
</html>
